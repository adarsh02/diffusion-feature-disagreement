# Main ImageNet-256 guidance settings.
experiment: guidance
method: local_probe
resolution: 256           # 128 uses pixel-space ADM; 256 and 512 use latent U-ViT
encoder: dino             # dino | mae
n: 10000
window: 30-35             # first and last guided steps, both included
dose: 2.0                 # controls the update size
top_frac: 0.75            # fraction of patches used for guidance
M: 5                      # local probes per guided step
batch_size: 10
out: outputs/imagenet256/guided_dino_w30-35_d2.0
